<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <!-- Mitsubishi 3 Red Rhombus Diamonds -->
  <g fill="#E60012">
    <!-- Top diamond -->
    <polygon points="50,15 65,40 50,65 35,40" />
    <!-- Bottom left diamond -->
    <polygon points="35,40 50,65 35,90 20,65" />
    <!-- Bottom right diamond -->
    <polygon points="65,40 80,65 65,90 50,65" />
  </g>
  <!-- Text Mitsubishi -->
  <text x="95" y="48" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="24" fill="#E60012" letter-spacing="-0.5">MITSUBISHI</text>
  <text x="96" y="70" font-family="'Arial', 'Helvetica Neue', sans-serif" font-weight="700" font-size="14" fill="#333333" letter-spacing="1">HEAVY IND.</text>
</svg>
