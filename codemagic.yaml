workflows:
  ios-signed:
    name: iOS - bản ký cho TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SISCOM Codemagic 2
    environment:
      node: 22
      xcode: latest
      groups:
        - firebase_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.phong.tramaloidieuhoa
      vars:
        PUPPETEER_SKIP_DOWNLOAD: 'true'
        VITE_ENABLE_APPLE_SIGN_IN: 'true'
        VITE_ENABLE_GOOGLE_SIGN_IN: 'true'
    scripts:
      - name: Cài thư viện và kiểm tra
        script: |
          npm ci
          npm run lint
          npm run build
      - name: Chuẩn bị cấu hình Firebase
        script: |
          set -eu
          test -n "${GOOGLE_SERVICE_INFO_BASE64:-}" || { echo 'Thiếu biến GOOGLE_SERVICE_INFO_BASE64 trong nhóm firebase_ios.'; exit 1; }
          printf '%s' "$GOOGLE_SERVICE_INFO_BASE64" | base64 --decode > ios/App/App/GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/App/App/GoogleService-Info.plist | grep -Fx 'com.phong.tramaloidieuhoa' >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' ios/App/App/GoogleService-Info.plist | grep -Fx 'tra-ma-loi-dieu-hoa-siscom' >/dev/null
      - name: Đồng bộ dự án iOS
        script: npx cap sync ios
      - name: Cấu hình callback Google iOS
        script: |
          set -eu
          REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' ios/App/App/GoogleService-Info.plist)
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' ios/App/App/Info.plist >/dev/null 2>&1; then
            echo 'Info.plist đã có URL types; không tự ghi đè cấu hình hiện có.'
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes array' ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0 dict' ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes array' ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED_CLIENT_ID" ios/App/App/Info.plist
      - name: Áp dụng cấu hình ký
        script: |
          cd ios/App
          xcode-project use-profiles
      - name: Tạo tệp IPA
        script: |
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
